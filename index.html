<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
	<script src="script.js"></script>
    <title>Hello, world!</title>
  </head>
  <body>
	<div class="container">

		<div class="row">
			<div class="col">
				1 of 1
			</div>
		</div>
		<form id="roadRunner" >
		<div class="row">

				
			<div class="col">
				
				<select class="form-select" aria-label="Default select example" id="select_work" onchange="ChoosedWorkload(this.value)">
					<option value="0">Without Workload</option>
					<option value="a">Workload A</option>
					<option value="b">Workload B</option>
					
				</select>

				
			</div>
			<div class="col">

					<select class="form-select" aria-label="Default select example" id="select_alg">
					<option value="0">Scheduling Algorithms</option>
					<option value="1">First-Come, First-Served (FCFS) </option>
					<option value="2">Shortest Job First (SJF)</option>
					<option value="2">Shortest Remaining Time First (SRTF)</option>
					<option value="2">Round Robin (RR)</option>
					
				</select>

			</div>
			
			<div class="col">
				<button type="button" class="btn btn-warning btn-md" id="btn_run" onclick="Run()">Run</button>
				
			</div>
		</div>
		<div class="row">
			<div class="col">
				<table class="table table-bordered" id="tblProcess">
  					<thead>
    					<tr>
     						<th scope="col">Process</th>
      						<th scope="col">Arrival Time</th>
      						<th scope="col">CPU Burst </th>
	  						<th scope="col">Actions </th>
	  
    					</tr>
  					</thead>
 					<tbody id="tableProcessBody">

					</tbody>
					<tfoot>
						<tr>
      						<td><input class="form-control form-control-sm" type="text" id="txtId"></td>
      						<td><input class="form-control form-control-sm" type="number" id="txtArrival"></td>
							<td><input class="form-control form-control-sm" type="number" id="txtBurst"></td>
     						<td><button type="button" class="btn btn-success" id="btn_add" onclick="Add()">Add Process</button></td>
   						 </tr>
  					</tfoot>
				</table>
			</div>
		</div>
	</form>
		<div class="row">
			<div class="col">
				Chart Side
			</div>
		</div>

  </div>
</div>
 
 
 
 
 
 
 
 
 
 
 
 
 
 
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
  </body>
</html>
